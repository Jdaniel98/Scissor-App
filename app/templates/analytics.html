<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics</title>
    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', path='/css/style.css') }}">
    <style>
        body { background-color: rgb(5, 27, 11); }
        h2, p, li, p a { color: white; }
    </style>
</head>
<body>
    <h2>Analytics for {{ short_link }}</h2>
    <p>Points to: <a href="{{ long_url }}">{{ long_url }}</a></p>
    <p>Total clicks: {{ clicks }}</p>
    <ul>
    {% for click in click_data %}
        <li>Clicked at {{ click.created_at | utc }}</li>
    {% else %}
        <li>No clicks yet.</li>
    {% endfor %}
    </ul>
    <p><a href="/url">Shorten another</a></p>
</body>
</html>
