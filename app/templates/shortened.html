<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortened URL</title>
    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', path='/css/style.css') }}">
    <style>
        body { background-color: rgb(5, 27, 11); }
        h2, p, p a { color: white; }
    </style>
</head>
<body>
    <h2>Your shortened URL:</h2>
    <p><a href="{{ short_link }}" target="_blank">{{ short_link }}</a></p>
    <img src="/qrcode?url={{ short_link | urlencode }}" alt="QR code for {{ short_link }}">
    <p>
        <a href="/qrcode?url={{ short_link | urlencode }}" download="qrcode.png">Download QR code</a>
        &middot; <a href="/analytics/{{ short_url }}">Analytics</a>
        &middot; <a href="/url">Shorten another</a>
    </p>
</body>
</html>
