<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', path='/css/style.css') }}">
    <style >h1{
        color: white;
        font-size: 30px;

    }
        .r h1 .form{
            border-radius: 30px;
        background-color: brown;
        }

    body{
    background-color:rgb(5, 27, 11);

    }
    label{ color: white; display: block; margin-top: 8px; }
    .error{ color: #ffb4a8; background: none; }
    .rm{
        color:rgb(3, 9, 29);
        background-color: orange;
        border-radius: 5px;
    }

    </style>
    <style>
        .rm:hover{
            background-color: white;

        }
    </style>
</head>
<body>

    <div class="r">
    <h1>URL Shortener</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form action="/shorten" method="post">
        <label for="long_url">Long URL</label>
        <input type="url" id="long_url" name="long_url" placeholder="Enter URL" value="{{ long_url or '' }}" required>
        <label for="custom_url">Custom link (optional)</label>
        <input type="text" id="custom_url" name="custom_url" placeholder="Custom link (optional)" value="{{ custom_url or '' }}">
        <button type="submit" class="rm">shorten</button>
    </form>
</div>

</body>
</html>
