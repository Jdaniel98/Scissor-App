<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Short URLs</title>
    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', path='/css/style.css') }}">


          <style>
            .table th{
              color: white;
              background-color: orange;
              
            }
          </style>
           <style>
            .table td a{
              color: white;
              background-color: black;
              
            }
          </style>
          <style>
            body{
            background-color:rgb(5, 27, 11);
            }
          </style>
          <style>
            h1{
              color: white;
            }
          </style>
</head>
<body>
    <h1>List of Short URLs</h1>
    <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Long URL</th>
            <th scope="col">Short link</th>
            <th scope="col">Clicks</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          {% for url in urls %}
          <tr>
            <th scope="row">{{ url.id }}</th>
            <td><a href="{{ url.long_url }}">{{ url.long_url }}</a></td>
            <td><a href="/{{ url.short_url }}">{{ url.short_url }}</a></td>
            <td>{{ url.clicks }}</td>
            <td><a href="/analytics/{{ url.short_url }}">Analytics</a></td>
          </tr>
          {% else %}
          <tr><td colspan="5">No short links yet. <a href="/url">Create one</a>.</td></tr>
          {% endfor %}
        </tbody>
      </table>
</body>
</html>
