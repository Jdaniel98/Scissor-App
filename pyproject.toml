[project]
name = "scissor"
version = "0.2.0"
description = "A small URL shortener built with FastAPI and SQLAlchemy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "fastapi>=0.110,<1",
    "jinja2>=3.1",
    "limits>=3.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "pypng>=0.20220715.0",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.27",
    "validators>=0.22",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient warns about httpx; not something this app controls.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency style: `db: Session = Depends(get_db)`
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.mypy]
python_version = "3.10"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*", "validators"]
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs database code in greenlets; count it.
concurrency = ["thread", "greenlet"]
source = ["app"]
